<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="/chandler-woodworking-preview/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chandler Woodworking</title>
  <meta name="description" content="Furniture made to commission in Santa Cruz, California.">
  <meta name="theme-color" content="#1E1A17">
  <meta name="color-scheme" content="dark only">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..500&family=Crimson+Pro:wght@200..700&display=swap">
  <link rel="stylesheet" href="css/site.css?v=10c10e68f8">
  <script>
    // Hide everything but the logo until the first-load reveal runs (failsafe after 3s).
    var h = document.documentElement, base = new URL(document.baseURI).pathname.replace(/\/$/, '');
    var p = location.pathname.slice(base.length).replace(/\/+$/, '');
    var onWork = p === '' || p.indexOf('/work') === 0;
    h.setAttribute('data-page', onWork ? 'work' : p === '/gallery' ? 'studio' : 'commissions');
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      h.setAttribute('data-reveal', onWork ? 'hero' : 'header');
      h.classList.add('revealing');
      setTimeout(function () { document.documentElement.classList.remove('revealing'); }, 3000);
    }
  </script>
  <script>window.CW_NO_API = true;</script>
  <script>window.CW_REVIEW = true;</script>
  <link rel="stylesheet" href="review/review.css?v=10c10e68f8">
  <script type="module" src="review/review.js?v=10c10e68f8"></script>
  <script type="module" src="js/site.js?v=10c10e68f8"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="header-mark tap" href="/" data-link aria-label="Chandler Woodworking, home"><span data-mark="header"></span></a>
    <nav class="nav-desktop" aria-label="Main">
      <a href="/" data-link data-nav="work">Home</a>
      <a href="/gallery" data-link data-nav="studio">Gallery</a>
      <a href="/contact" data-link data-nav="commissions">Contact</a>
      <span class="nav-ind" aria-hidden="true"></span>
    </nav>
  </header>

  <main id="main" tabindex="-1">
    <!-- WORK -->
    <section class="page" data-page="work" hidden>
      <div class="hero">
        <div class="hero-photo frame" data-hero-photo></div>
        <span class="hero-wash" aria-hidden="true"></span>
        <div class="hero-mark" data-mark="hero"></div>
        <h1 class="sr-only" data-bind="name"></h1>
        <button class="scroll-cue tap reveal-after" type="button" data-scroll-cue aria-label="Scroll to the work">
          <svg viewBox="0 0 24 13" aria-hidden="true"><path d="M12 13 0 0h24z"/></svg>
        </button>
      </div>
      <p class="intro" data-intro data-rise></p>
      <ol class="sequence" data-sequence></ol>
    </section>

    <!-- STUDIO -->
    <section class="page" data-page="studio" hidden>
      <div class="wrap gallery-wrap">
        <h1 class="section-title">Selected works</h1>
        <ul class="works-grid" data-works></ul>
      </div>
    </section>

    <!-- COMMISSIONS -->
    <section class="page" data-page="commissions" hidden>
      <div class="wrap commission-grid">
        <div class="commission-photo" data-aside-photo></div>

        <div class="form-col">
          <h1 class="sr-only">Contact</h1>
          <form class="inquiry" data-form novalidate>
            <div class="field">
              <label class="idea-label" for="f-desc">Your idea</label>
              <textarea id="f-desc" class="idea-input" name="description" rows="7" required placeholder="Start here…"></textarea>
              <p class="err" data-err="description" hidden>Add a few words about the idea.</p>
            </div>

            <div class="field two">
              <div>
                <label class="field-label" for="f-name">Name</label>
                <input id="f-name" name="name" autocomplete="name" required>
                <p class="err" data-err="name" hidden>Add your name.</p>
              </div>
              <div>
                <label class="field-label" for="f-email">Email</label>
                <input id="f-email" name="email" type="email" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" required>
                <p class="err" data-err="email" hidden>Add a valid email.</p>
              </div>
            </div>

            <div class="send-bar">
              <button class="btn-primary btn-send tap" type="submit" data-send>Send</button>
              <p class="err" data-err="send" hidden></p>
            </div>
          </form>

          <div class="confirm" data-confirm hidden tabindex="-1">
            <h2 class="display-line">Sent.</h2>
            <p data-confirm-text></p>
          </div>

          <div class="next-note">
            <h2 class="label muted">Next</h2>
            <ol class="next-list">
              <li><span class="num">1</span><span data-rid="reply-time">Reply within a week</span></li>
              <li><span class="num">2</span><span>Call or visit</span></li>
              <li><span class="num">3</span><span>Drawings and quote</span></li>
            </ol>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span class="foot-item"><a class="tap" data-footer-email data-rid="email"></a></span>
      <span class="foot-item"><span data-bind="location" data-rid="location"></span></span>
    </div>
  </footer>

  <nav class="tabbar" aria-label="Main">
    <a href="/" data-link data-nav="work" class="tap">Home</a>
    <a href="/gallery" data-link data-nav="studio" class="tap">Gallery</a>
    <a href="/contact" data-link data-nav="commissions" class="tap">Contact</a>
  </nav>

  <div class="piece-layer" data-piece-layer hidden></div>
</body>
</html>
